<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>tool calls</title>
<style>
  :root { color-scheme: dark }
  body { margin:0; background:#0a0a0b; font:15px/1.5 ui-sans-serif,system-ui,sans-serif; padding:40px 60px;
         display:grid; place-items:center; min-height:100vh }
  .row { display:grid; grid-template-columns:repeat(3,300px); gap:26px }
  .box { width:300px; height:300px; border-radius:26px; overflow:hidden; border:1px solid #232327 }
  avatar-motion { width:100%; height:100%; display:block }
</style></head><body>
<div class="row" id="r"></div>
<script type="module">
import '/src/avatar-motion.js'
const CALLS = [
  { seed:'agent:reception-01', colour:'#BFDBFE', ink:'#0E7490', call:{ name:'search_calendar', args:'{ day: "tue" }', result:'3 slots' } },
  { seed:'agent:clinic-02',    colour:'#FDE68A', ink:'#BE185D', call:{ name:'create_booking', args:'{ at: "14:30" }', result:'confirmed' } },
  { seed:'agent:shop-03',      colour:'#BBF7D0', ink:'#9333EA', call:{ name:'send_sms', args:'{ to: "+421…" }', result:'sent' } },
]
const r = document.getElementById('r')
for (const c of CALLS) {
  const box = document.createElement('div'); box.className = 'box'; box.style.background = c.colour
  const el = document.createElement('avatar-motion')
  el.setAttribute('seed', c.seed); el.setAttribute('kind', 'agent'); el.setAttribute('color', c.ink)
  el.setAttribute('emblem', 'icon'); el.setAttribute('no-aura', ''); el.setAttribute('no-mount', '')
  el.setAttribute('transparent-bg', '')
  box.appendChild(el); r.appendChild(box)
  setTimeout(() => el.runTool(c.call, 60000), 900)
}
</script></body></html>
