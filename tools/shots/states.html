<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>states</title>
<style>
  :root { color-scheme: dark }
  body { margin:0; background:#0a0a0b; color:#fafaf8; font:15px/1.5 ui-sans-serif,system-ui,sans-serif; padding:34px }
  .grid { display:grid; grid-template-columns:repeat(6,1fr); gap:16px; max-width:1180px; margin:0 auto }
  .cell { display:grid; gap:8px; justify-items:center }
  .box { width:100%; aspect-ratio:1; border-radius:18px; overflow:hidden; border:1px solid #232327; background:#17181a }
  avatar-motion { width:100%; height:100%; display:block }
  span { font:0.72rem ui-monospace,Menlo,monospace; color:#8a8a93 }
</style></head><body>
<div class="grid" id="g"></div>
<script type="module">
import '/src/avatar-motion.js'
const STATES = ['idle','listening','thinking','working','searching','writing',
  'happy','excited','curious','confused','surprised','sad',
  'laughing','proud','shy','suspicious','angry','scared',
  'sleeping','drowsy','bored','playful','celebrate','alerting']
const COLORS = ['#3B82F6','#16A34A','#9333EA','#E36F3D','#0E7490','#BE185D','#EAB308','#14B8A6',
  '#F43F5E','#8B5CF6','#06B6D4','#84CC16','#EF4444','#F97316','#22C55E','#0EA5E9']
const g = document.getElementById('g')
STATES.forEach((s, i) => {
  const cell = document.createElement('div'); cell.className = 'cell'
  const box = document.createElement('div'); box.className = 'box'
  const el = document.createElement('avatar-motion')
  el.setAttribute('seed', `agent:s-${i}`)
  el.setAttribute('kind', i % 3 === 2 ? 'customer' : 'agent')
  el.setAttribute('state', s)
  if (i % 3 !== 2) el.setAttribute('color', COLORS[i % COLORS.length])
  el.setAttribute('emblem', 'icon')
  el.setAttribute('no-aura', ''); el.setAttribute('no-mount', '')
  box.appendChild(el)
  const label = document.createElement('span'); label.textContent = s
  cell.append(box, label); g.appendChild(cell)
})
</script></body></html>
