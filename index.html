<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>avatar-motion — living avatars for AI agents and people</title>
    <meta
      name="description"
      content="Living avatars for AI agents and people. One string in, one character out. 39 states, real lip-sync, MCP and CLI control. No build step, no dependencies."
    />
    <meta property="og:title" content="avatar-motion" />
    <meta
      property="og:description"
      content="Living avatars for AI agents and people. One string in, one character out."
    />
    <meta property="og:image" content="./docs/idle.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%233B82F6'/%3E%3Ccircle cx='11' cy='14' r='3.2' fill='%23fff'/%3E%3Ccircle cx='21' cy='14' r='3.2' fill='%23fff'/%3E%3Ccircle cx='11.8' cy='14.6' r='1.5'/%3E%3Ccircle cx='21.8' cy='14.6' r='1.5'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --page: #f4f2ec;
        --raised: #fffdf7;
        --line: #dbd7cb;
        --ink: #16170f;
        --muted: #74766b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0a0a0b;
          --raised: #17181a;
          --line: #232327;
          --ink: #fafaf8;
          --muted: #8a8a93;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; overflow: hidden;
        background: var(--page);
        color: var(--ink);
        font: 16px/1.6 ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; }

      /* ── nav — floats over the stream, takes no height from it ───── */
      nav {
        position: fixed; inset: 0 0 auto; z-index: 5;
        display: flex; align-items: center; justify-content: space-between;
        padding: 18px 24px; gap: 12px;
      }
      .wordmark { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 0.86rem; }
      nav .links { display: flex; gap: 4px; }
      nav a {
        color: var(--muted); text-decoration: none; font-size: 0.88rem;
        padding: 6px 11px; border-radius: 999px; transition: color 0.15s, background 0.15s;
      }
      nav a:hover { color: var(--ink); background: var(--raised); }
      nav button {
        font: inherit; font-size: 0.88rem; color: var(--muted); cursor: pointer;
        background: transparent; border: 0; padding: 6px 11px; border-radius: 999px;
        transition: color 0.15s, background 0.15s;
      }
      nav button:hover { color: var(--ink); background: var(--raised); }
      nav button[aria-pressed='true'] { color: var(--ink); background: var(--raised); }

      /* ── the stream: the page IS this ────────────────────────────── */
      .stream {
        position: relative; height: 100%; overflow: hidden;
        display: grid; place-items: center;
      }
      .stage { position: absolute; inset: 0; pointer-events: none; }
      .tile {
        position: absolute; left: 0; top: 0; width: 112px; height: 112px;
        border-radius: 20px; overflow: hidden; will-change: transform, opacity;
        opacity: 0;
      }
      .tile avatar-motion { width: 100%; height: 100%; display: block; }

      /* ── the words, in the hole the stream leaves open ───────────── */
      .stream-copy {
        position: relative; z-index: 2; text-align: center;
        display: grid; gap: 16px; justify-items: center;
        padding: 22px 26px; max-width: min(92vw, 34em);
      }
      h1 {
        margin: 0; font-weight: 600; letter-spacing: -0.05em; line-height: 1;
        /* One line, always. The vw term is what keeps it on one line on a
           narrow window; the ch cap stops it becoming a billboard on a wide
           one. */
        font-size: min(4.4rem, 7.2vw);
        white-space: nowrap;
      }
      .lede { margin: 0; color: var(--muted); font-size: 1.05rem; }
      .count {
        margin: 0 0 -6px; color: var(--muted); letter-spacing: 0.06em;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 0.74rem;
      }
      .count b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

      /* ── install line — the whole thing copies ───────────────────── */
      .cmd {
        display: inline-flex; align-items: center; gap: 12px; cursor: pointer;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 14px;
        color: var(--ink); background: color-mix(in oklab, var(--raised) 72%, transparent);
        border: 1px solid var(--line); border-radius: 12px;
        padding: 10px 12px 10px 16px; transition: border-color 0.15s, background 0.15s;
        backdrop-filter: blur(6px);
      }
      .cmd:hover { background: var(--raised); border-color: color-mix(in oklab, var(--muted) 50%, transparent); }
      .cmd .sigil, .cmd .ico { color: var(--muted); user-select: none; }
      .cmd:hover .ico { color: var(--ink); }
      .cmd .ico { display: flex; transition: color 0.15s; }

      /* ── what it plugs into: one word each, nothing more ─────────── */
      .badges {
        list-style: none; margin: 0 auto; padding: 0;
        align-items: center;
        display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 0.72rem;
        color: var(--muted);
      }
      .badges li {
        border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
        background: color-mix(in oklab, var(--raised) 72%, transparent);
        backdrop-filter: blur(6px);
      }

      footer {
        position: fixed; inset: auto 0 0; z-index: 5;
        display: flex; align-items: center; justify-content: center;
        gap: 8px 14px; flex-wrap: wrap; padding: 14px 22px;
      }


      @media (max-width: 620px) {
        .stream-copy { gap: 13px; padding: 18px; }
        .tile { width: 84px; height: 84px; border-radius: 15px; }
      }
    </style>
  </head>

  <body>
    <nav>
      <span class="wordmark">avatar&#8209;motion</span>
      <span class="links">
        <button id="sound" type="button" aria-pressed="false" aria-label="Sound off">
          <span id="sound-glyph">&#9834;</span> sound
        </button>
        <a href="https://github.com/dxcore35/avatar-motion">GitHub</a>
      </span>
    </nav>

    <!-- ── the whole page: one stream, the words in its blank centre ── -->
    <main class="stream" id="stream">
      <div class="stage" id="stage" aria-hidden="true"></div>

      <div class="stream-copy">
        <p class="count"><b id="stream-count">0</b> made since you arrived</p>

        <h1>Avatars that are alive</h1>
        <p class="lede">It never runs out of people or agents 🙂</p>

        <button class="cmd" id="cmd" aria-label="Copy: bun add github:dxcore35/avatar-motion">
          <span class="sigil" aria-hidden="true">$</span>
          <span id="cmd-text">bun add github:dxcore35/avatar-motion</span>
          <span class="ico" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="11" height="11" rx="2.5" />
              <path d="M5.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v.5" />
            </svg>
          </span>
        </button>
      </div>
    </main>

    <footer>
      <ul class="badges">
        <li>MCP</li>
        <li>CLI</li>
        <li>Web Component</li>
        <li>React</li>
        <li>Vue</li>
      </ul>
    </footer>

    <script type="module" src="./src/site.js"></script>
  </body>
</html>
