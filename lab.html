<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Lab — avatar-motion</title>
    <style>
      /* One language for the whole workbench: a label, then pills. States,
         expressions, eye animations and switches all use it, so there is
         nothing new to learn after the first row. */
      :root {
        --page: #f4f2ec;
        --raised: #fffdf7;
        --line: #dbd7cb;
        --ink: #16170f;
        --muted: #74766b;
        --accent: #2f66e8;
        --accent-ink: #2f66e8;
        --on-accent: #ffffff;
        --mono: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0a0a0b;
          --raised: #17181a;
          --line: #232327;
          --ink: #fafaf8;
          --muted: #8a8a93;
          --accent: #6f96ff;
          --accent-ink: #6f96ff;
          --on-accent: #0c1630;
        }
      }
      * { box-sizing: border-box; }
      figure { margin: 0; }
      body {
        margin: 0; padding: 0 22px 64px;
        background: var(--page); color: var(--ink);
        font: 14px/1.55 ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .frame { max-width: 1240px; margin: 0 auto; }
      p { margin: 0; }
      .note { color: var(--muted); font-size: 0.78rem; }

      /* ── header is one thin line: where you are, and what is happening ── */
      header {
        display: flex; align-items: center; justify-content: space-between;
        gap: 20px; flex-wrap: wrap; padding: 14px 0 12px;
      }
      .kicker { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.06em; }
      .kicker a { color: inherit; text-decoration: none; }
      .kicker a:hover { color: var(--ink); }
      .status {
        display: flex; gap: 13px; flex-wrap: wrap;
        font-family: var(--mono); font-size: 0.66rem; color: var(--muted);
      }
      .status b { color: var(--ink); font-weight: 500; }

      /* ── the centrepiece ────────────────────────────────────────────── */
      .stage {
        display: grid; gap: 14px; justify-items: center;
        padding: 22px 20px 20px; margin-bottom: 16px;
        border: 1px solid var(--line); border-radius: 20px; background: var(--raised);
      }
      .stage-avatars {
        display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px; width: 100%; max-width: 760px;
      }
      .figure { display: grid; gap: 7px; justify-items: center; }
      .figure > .box { width: 100%; aspect-ratio: 1; border-radius: 20px; overflow: hidden; }
      /* Agents carry no background of their own, so the stage supplies the page
         each theme would put behind them. */
      .box.theme-dark { background: #14161b; }
      .box.theme-light { background: #f4f2ec; }
      .figure figcaption {
        font-family: var(--mono); font-size: 0.62rem; color: var(--muted);
        letter-spacing: 0.1em; text-transform: uppercase;
      }
      .actions { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; align-items: center; }
      .stage-note { text-align: center; max-width: 60ch; }
      .stage-note:empty { display: none; }
      .meter { width: 110px; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
      .meter i { display: block; height: 100%; width: 0%; border-radius: 99px; background: var(--accent); transition: width 60ms linear; }

      /* ── who: one line, no field labels — the options say it ────────── */
      .who {
        display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
        padding: 10px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px;
      }
      .who #part-pickers { display: contents; }
      .who input[type='text'] { width: 128px; }
      .who #age { width: 62px; }
      .who input[type='color'] { width: 30px; height: 26px; padding: 1px; }
      .who select { max-width: 128px; }

      /* ── controls ───────────────────────────────────────────────────── */
      button, select, input[type='text'] {
        font: inherit; font-size: 0.74rem; color: var(--ink); background: var(--raised);
        border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
        transition: border-color 0.14s, color 0.14s, background 0.14s;
      }
      button { cursor: pointer; }
      button:hover { border-color: var(--muted); color: var(--ink); }
      .actions button[aria-pressed='true'] {
        background: color-mix(in oklab, var(--accent) 20%, transparent);
        border-color: color-mix(in oklab, var(--accent-ink) 60%, transparent);
        color: var(--accent-ink);
        box-shadow: 0 0 16px -2px color-mix(in oklab, var(--accent) 34%, transparent);
      }
      input[type='color'] { border: 1px solid var(--line); border-radius: 8px; background: var(--raised); cursor: pointer; }

      /* Every pill row: a label, then the pills, flowing until the width
         runs out. Nothing gets a line of its own. */
      .chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      .chips button, .pill {
        display: inline-flex; align-items: center; gap: 5px;
        border: 1px solid color-mix(in oklab, var(--line) 80%, transparent);
        border-radius: 999px;
        padding: 4px 10px; font-family: var(--mono); font-size: 0.66rem;
        color: var(--muted); background: transparent; cursor: pointer;
        transition: color 0.14s, border-color 0.14s, background 0.14s, box-shadow 0.18s;
      }
      .chips button:hover, .pill:hover {
        color: var(--ink); border-color: color-mix(in oklab, var(--muted) 45%, transparent);
      }
      .chips button svg { flex: none; opacity: 0.65; color: inherit; }

      /* Selected is a tinted capsule, not a solid block: a wash of the avatar's
         colour, a brighter ring of it, the label in it, and a soft bloom
         around it. The label is always the bright hue, so it can never come
         out as grey-on-colour. */
      .chips button[aria-pressed='true'],
      .pill:has(input:checked) {
        background: color-mix(in oklab, var(--accent) 20%, transparent);
        border-color: color-mix(in oklab, var(--accent-ink) 60%, transparent);
        color: var(--accent-ink);
        box-shadow: 0 0 16px -2px color-mix(in oklab, var(--accent) 34%, transparent);
      }
      .chips button[aria-pressed='true']:hover,
      .pill:has(input:checked):hover {
        background: color-mix(in oklab, var(--accent) 28%, transparent);
        border-color: var(--accent-ink);
        color: var(--accent-ink);
      }
      .chips button[aria-pressed='true'] svg { opacity: 1 }
      .pill input { position: absolute; opacity: 0; pointer-events: none; }
      .group-label {
        font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--muted);
        padding: 0 7px 0 12px; white-space: nowrap;
      }
      .chips > .group-label:first-child { padding-left: 0; }

      .dials { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 16px; }
      label.control { display: grid; gap: 1px; }
      .control-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--mono); font-size: 0.62rem; color: var(--muted); }
      .control-head output { color: var(--accent-ink); }
      input[type='range'] { width: 100%; height: 13px; accent-color: var(--accent-ink); }

      /* ── panels are a label and a hairline, never a card ─────────────── */
      .shell { display: grid; }
      .panel { display: grid; gap: 8px; }
      h3 {
        margin: 0; font-family: var(--mono); font-size: 0.62rem; font-weight: 500;
        letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
      }
      #tab-drive { display: grid; gap: 14px; }
      #tab-drive[hidden] { display: none; }
      #tab-drive > .panel + .panel { border-top: 1px solid var(--line); padding-top: 12px; }
      /* The gallery is a drawer under the controls, opened from the stage. */
      .gallery-panel[hidden] { display: none; }
      .gallery-panel { padding-top: 12px; }

      /* ── crowd ──────────────────────────────────────────────────────── */
      .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 4px; align-items: start; }
      .gallery .figure { justify-items: stretch; gap: 0; }
      .gallery .figure > .box { border-radius: 10px; width: 100%; height: auto; border: 1px solid var(--line); cursor: pointer; }
      .pager { display: flex; gap: 5px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 12px; }
      .pager button { min-width: 32px; font-family: var(--mono); font-size: 0.7rem; }
      .pager button[disabled] { opacity: 0.35; cursor: default; }
      .pager .gap { color: var(--muted); font-family: var(--mono); font-size: 0.7rem; }

      @media (max-width: 760px) {
        .stage-avatars { grid-template-columns: 1fr 1fr; gap: 10px; }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <header>
        <span class="kicker"><a href="./">&#8592; avatar&#8209;motion</a> &nbsp;/&nbsp; lab</span>
        <p class="status">
          <span>state <b id="r-state">idle</b></span>
          <span>expr <b id="r-expr">00</b></span>
          <span>turn <b id="r-turn">0&deg;</b></span>
          <span>cut <b id="r-cut">2</b></span>
          <span><b id="r-fps">&ndash;</b> fps</span>
          <span><b id="r-active">0</b>/<b id="r-total">0</b></span>
          <span>gl <b id="r-aura">0</b>/3</span>
        </p>
      </header>

      <!-- ── The centrepiece: one person, both themes ─────────────────── -->
      <section class="stage">
        <div class="stage-avatars">
          <figure class="figure">
            <div class="box theme-dark" id="box-live"></div>
            <figcaption>dark</figcaption>
          </figure>
          <figure class="figure">
            <div class="box theme-light" id="box-light"></div>
            <figcaption>light</figcaption>
          </figure>
        </div>

        <div class="actions">
          <button class="primary" id="btn-demo" aria-pressed="false">Change everything</button>
          <button id="btn-random">Random</button>
          <button id="btn-gallery" aria-pressed="false">Gallery</button>
          <button id="btn-reset">Reset</button>
          <button id="btn-mic" aria-pressed="false">Speak into it</button>
          <div class="meter" aria-hidden="true"><i id="mic-level"></i></div>
        </div>
        <p class="note stage-note" id="demo-note"></p>
        <p class="note stage-note" id="mic-note"></p>
      </section>

      <!-- ── Who ──────────────────────────────────────────────────────── -->
      <section class="who">
        <span class="group-label">who</span>
        <input type="text" id="seed" value="agent:reception-01" title="Seed" />
        <select id="kind" title="Kind">
          <option value="agent">agent</option>
          <option value="customer">person</option>
        </select>
        <input type="color" id="color" value="#3B82F6" title="Agent colour" />
        <select id="gender" title="Gender">
          <option value="">any gender</option>
          <option value="female">female</option>
          <option value="male">male</option>
        </select>
        <input type="text" id="age" placeholder="age" inputmode="numeric" title="Age" />
        <span id="part-pickers"></span>
        <span class="note" id="kind-note" hidden></span>
        <span class="note" id="skull-note" hidden></span>
      </section>

      <div class="shell">
        <main>
          <section id="tab-drive">
            <section class="panel">
              <h3>states</h3>
              <div class="chips" id="state-groups"></div>
            </section>

            <section class="panel">
              <h3>expressions</h3>
              <div class="chips" id="expr-grid"></div>
            </section>

            <section class="panel">
              <h3>eye animations</h3>
              <div class="chips" id="act-grid"></div>
              <p class="note" id="act-note" hidden></p>
            </section>

            <section class="panel">
              <h3>switches</h3>
              <div class="chips">
                <label class="pill"><input type="checkbox" id="mouse" /><span>eyes follow pointer</span></label>
                <label class="pill"><input type="checkbox" id="emphasis" /><span>bigger eyes</span></label>
                <label class="pill"><input type="checkbox" id="look" checked /><span>light + texture</span></label>
                <label class="pill"><input type="checkbox" id="aura" checked /><span>aura shader</span></label>
                <label class="pill"><input type="checkbox" id="auto-blink" checked /><span>auto blink</span></label>
                <label class="pill"><input type="checkbox" id="auto-expr" checked /><span>auto expression</span></label>
                <label class="pill"><input type="checkbox" id="auto-motion" checked /><span>auto motion</span></label>
                <span class="group-label">emblem</span>
                <select id="emblem">
                  <option value="icon">icon</option>
                  <option value="item">hat / pet</option>
                  <option value="off">none</option>
                </select>
                <button class="primary" id="btn-acts" aria-pressed="false">play all animations</button>
              </div>
            </section>

            <section class="panel">
              <h3>dials</h3>
              <div class="dials">
                <label class="control">
                  <span class="control-head"><span>spring</span><output id="o-spring">7.0</output></span>
                  <input type="range" id="spring" min="4" max="12" step="0.5" value="7" />
                </label>
                <label class="control">
                  <span class="control-head"><span>gaze x</span><output id="o-gx">0.00</output></span>
                  <input type="range" id="gx" min="-1" max="1" step="0.01" value="0" />
                </label>
                <label class="control">
                  <span class="control-head"><span>gaze y</span><output id="o-gy">0.00</output></span>
                  <input type="range" id="gy" min="-1" max="1" step="0.01" value="0" />
                </label>
                <label class="control">
                  <span class="control-head"><span>turn</span><output id="o-turn">0&deg;</output></span>
                  <input type="range" id="turn" min="-110" max="110" step="1" value="0" />
                </label>
                <label class="control">
                  <span class="control-head"><span>eye size</span><output id="o-scale">1.00&times;</output></span>
                  <input type="range" id="scale" min="0.3" max="2" step="0.02" value="1" />
                </label>
              </div>
              <p class="note" id="gaze-note" hidden></p>
              <span hidden id="front-angle"></span>
            </section>
          </section>

          <section class="panel gallery-panel" id="gallery-panel" hidden>
              <h3>pick anyone</h3>
              <div class="gallery" id="gallery"></div>
              <nav class="pager" id="crowd-pager" aria-label="Crowd pages"></nav>
              <p class="note" id="crowd-count" style="text-align:center"></p>
          </section>
        </main>
      </div>
    </div>

    <script type="module" src="./src/lab.js"></script>
  </body>
</html>
